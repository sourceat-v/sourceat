<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#111110"/>
      <stop offset="100%" stop-color="#0B2219"/>
    </linearGradient>
    <linearGradient id="logo" x1="80" y1="0" x2="620" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="30%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#1D9E75"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="1080" cy="120" r="240" fill="#1D9E75" opacity="0.05"/>
  <circle cx="160" cy="530" r="180" fill="#1D9E75" opacity="0.04"/>
  <circle cx="700" cy="600" r="100" fill="#1D9E75" opacity="0.03"/>

  <!-- Left accent bar -->
  <rect x="80" y="188" width="5" height="220" fill="#1D9E75" rx="2.5"/>

  <!-- sourceat wordmark -->
  <text x="106" y="282"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,sans-serif"
        font-size="100" font-weight="800" letter-spacing="-4"
        fill="url(#logo)">sourceat</text>

  <!-- Sub label -->
  <text x="109" y="318"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,sans-serif"
        font-size="13" font-weight="400" letter-spacing="4"
        fill="rgba(255,255,255,0.3)">SOURCE AND EAT</text>

  <!-- Tagline line 1 -->
  <text x="109" y="382"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,sans-serif"
        font-size="30" font-weight="300"
        fill="rgba(255,255,255,0.62)">Trending Korean food.</text>

  <!-- Tagline line 2 -->
  <text x="109" y="424"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,sans-serif"
        font-size="30" font-weight="300"
        fill="rgba(255,255,255,0.62)">Best prices across the US.</text>

  <!-- Retailer tags -->
  <text x="109" y="540"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,sans-serif"
        font-size="18" font-weight="500" letter-spacing="0.5"
        fill="#1D9E75">Amazon · H-Mart · Weee! · Wooltari · Yamibuy</text>

  <!-- Domain -->
  <text x="1118" y="588"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,sans-serif"
        font-size="18" font-weight="400" text-anchor="end"
        fill="rgba(255,255,255,0.25)">sourceat.co</text>
</svg>
